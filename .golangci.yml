# golangci-lint configuration for promptsheon
# PR-0 c0.1: minimal setup with gofmt, govet, errcheck.
# PR-5A c5.0: extends with custom promptsheon-bans plugin.

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - gofmt
    - govet
    - errcheck
    - ineffassign
    - unused
    - staticcheck
  fast-only: false

linters-settings:
  gofmt:
    simplify: true
  govet:
    enable-all: true
  errcheck:
    check-blank: true
    check-type-assertions: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - ineffassign
        - unused
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false