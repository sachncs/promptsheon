version: "2"

# golangci-lint v2 configuration for promptsheon.
#
# Migrated from v1 schema. The v1 file had no `version:` key
# (which v2.x rejects) and used the `linters:` shorthand block
# that v2.x removed. In v2, `gofmt` is a formatter (not a
# linter) and lives under `formatters:`; the remaining checks
# (govet, errcheck, ineffassign, unused, staticcheck) live
# under `linters:`. The errcheck `check-blank` and
# `check-type-assertions` settings remain under
# `linters.settings`.
#
# Re-run `golangci-lint config verify` after editing this file;
# v2.x validates the file against an embedded JSON schema and
# rejects unknown keys with no obvious place to report them.
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: standard
  enable:
    - errcheck
    - ineffassign
    - staticcheck
  settings:
    govet:
      enable-all: true
    errcheck:
      check-blank: true
      check-type-assertions: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
