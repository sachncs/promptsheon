\* tla/release_lifecycle.cfg
\*
\* TLC configuration for the release-lifecycle spec. The model
\* is small on purpose: the spec pins the per-(Capability,
\* Environment) "exactly one active" invariant and the
\* Maker/Checker separation-of-duties rule.
\*
\* Three Releases, two Environments, MaxReleases=2 is the
\* smallest model that exercises:
\*   - Create + Approve + Activate on the same release
\*   - Supersede when a successor activates in the same env
\*   - MakerChecker (creator = "alice" cannot approve)
\*   - Rollback from active
\*   - Rollback from approved (pre-Activate undo)
\*

SPECIFICATION Spec

CONSTANTS
    Releases = {r1, r2, r3}
    Environments = {dev, prod}
    MaxReleases = 2

INVARIANTS
    Safety
