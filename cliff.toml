# git-cliff configuration. https://git-cliff.org
#
# Generates CHANGELOG.md from commit messages between tags.
# Tag pattern matches v0.0.0, v1.2.3, etc. The output is conventional
# commits (parsed from the subject + body) grouped by type.

[changelog]
header = """
# Changelog

All notable changes to promptsheon are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/),
and this project adheres to [Semantic Versioning](https://semver.org/).

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [unreleased]
{% endif %}\
{% for group, commits in commits | filter(attribute="merge.commit_id", value="") | group_by(attribute="type") %}
### {{ group | upper_first }}
{% for commit in commits | sort(attribute="message") %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (**BREAKING**) {% endif %}
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
topo_order = false
sort_commits = "oldest"

[bumper]
enabled = true

[git_tags]
enabled = false