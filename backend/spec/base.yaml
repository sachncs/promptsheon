openapi: 3.0.3
info:
  title: Promptsheon API
  description: Version Control System for AI agent intelligence
  version: 0.3.0
security:
- BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'API key prefixed with ps_. Send as: Authorization: Bearer ps_...'
  schemas:
    object:
      type: object
      additionalProperties: true
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
