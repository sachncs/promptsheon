# Route group: reasoning
paths:
  /api/v1/reasoning/compile:
    post:
      summary: 'handleReasoningCompile turns an Intent into a Plan.


        POST /api/v1/reasoning/compile

        Body: reasoning.Intent JSON

        200 OK with reasoning.Plan

        404 Not Found: ErrNoMatch

        409 Conflict: ErrConstraintViolation'
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '500':
          description: Internal server error
