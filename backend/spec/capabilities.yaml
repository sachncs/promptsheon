# Route group: capabilities
paths:
  /api/v1/capabilities/{capability_id}/datasets:
    get:
      summary: GET capabilities/{capability_id}/datasets
      parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '404':
          description: Not found
    post:
      summary: POST capabilities/{capability_id}/datasets
      parameters:
      - name: capability_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
