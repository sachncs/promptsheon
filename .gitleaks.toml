# gitleaks configuration. https://github.com/gitleaks/gitleaks
# Detects accidental secret commits in the TypeScript port.

title = "promptsheon secrets"

[extend]
useDefault = true

# OpenAI API keys
[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''\bsk-[a-zA-Z0-9]{32,}\b'''
keywords = ["sk-"]
tags = ["api-key", "openai"]

# Anthropic API keys
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''\bsk-ant-[a-zA-Z0-9-]{32,}\b'''
keywords = ["sk-ant-"]
tags = ["api-key", "anthropic"]

# AWS Bedrock / generic AWS credentials
[[rules]]
id = "aws-access-token"
description = "AWS access token"
regex = '''\b(AKIA|ASIA)[0-9A-Z]{16}\b'''
keywords = ["AKIA", "ASIA"]
tags = ["aws", "credentials"]

# Generic Bearer tokens in committed files
[[rules]]
id = "bearer-token"
description = "Generic Bearer token"
regex = '''[Bb]earer\s+[A-Za-z0-9._-]{20,}\b'''
keywords = ["Bearer"]
tags = ["api-key"]
