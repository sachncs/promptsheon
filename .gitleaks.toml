# gitleaks configuration. https://github.com/gitleaks/gitleaks
# Tunes the default ruleset to recognise the promptsheon API
# key prefix (ps_<64-hex>) and the bootstrap token env var.

title = "promptsheon secrets"

[extend]
useDefault = true

# promptsheon API keys: ps_<64 hex>
[[rules]]
id = "promptsheon-api-key"
description = "promptsheon API key (ps_ prefix + 64 hex)"
regex = '''\bps_[a-f0-9]{64}\b'''
keywords = ["ps_"]
tags = ["api-key", "promptsheon"]

# Bootstrap admin token env var
[[rules]]
id = "promptsheon-bootstrap-token"
description = "PROMPTSHEON_BOOTSTRAP_TOKEN env var leaked"
regex = '''PROMPTSHEON_BOOTSTRAP_TOKEN[ ]*=[ ]*["']?[A-Za-z0-9+/=]{16,}'''
keywords = ["PROMPTSHEON_BOOTSTRAP_TOKEN"]
tags = ["secret", "promptsheon"]

# Allow-list: audit chain state and other generated JSON files
[allowlist]
description = "Generated files that legitimately mention key names"
paths = [
  '''docs/refactor/audit/.*''',
  '''vendor/.*''',
]