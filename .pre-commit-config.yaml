# OPS-CI-1: pre-commit hooks. The hooks that match every commit
# land here; the slower checks (full vitest, Playwright, markdownlint)
# live in CI so the local hook time stays under a second.
#
# Operators install with `pip install pre-commit && pre-commit install`.
# Every hook is `language: system` so the operator's locally-installed
# pnpm + eslint + tsc drive the checks — there is no extra Python-side
# dependency for a Node project.

repos:
  - repo: local
    hooks:
      - id: shared-typecheck
        name: shared tsc --noEmit
        description: Type-check the shared package (fastest package to typecheck).
        language: system
        entry: bash -c 'cd packages/shared && pnpm typecheck'
        files: ^packages/shared/src/.*\.ts$
        pass_filenames: false

      - id: server-typecheck
        name: server tsc --noEmit
        description: Type-check the server package.
        language: system
        entry: bash -c 'cd packages/server && pnpm typecheck'
        files: ^packages/server/src/.*\.ts$
        pass_filenames: false

      - id: frontend-eslint
        name: frontend eslint
        description: Lint the frontend with eslint-config-next + AGENTS.md rules.
        language: system
        entry: bash -c 'cd frontend && pnpm exec eslint --fix $(git diff --cached --name-only --diff-filter=ACM | grep -E "\.(ts|tsx)$" | sed "s|^|frontend/|" || true)'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: prettier-shared-server
        name: prettier (shared + server)
        description: Format the touched shared + server files with Prettier.
        language: system
        entry: bash -c 'changed=$(git diff --cached --name-only --diff-filter=ACM | grep -E "^(packages/(shared|server)/src/.*\.ts$|packages/(shared|server)/test/.*\.ts$)" || true); if [ -n "$changed" ]; then pnpm exec prettier --write $changed || true; fi'
        files: ^packages/(shared|server)/.*\.ts$
        pass_filenames: false

      - id: changelog-footer
        name: changelog keep-a-changelog footer
        description: Fail if CHANGELOG.md does not end with the Keep-a-Changelog footer.
        language: system
        entry: bash -c 'tail -n 5 CHANGELOG.md | grep -q "Keep a Changelog" || (echo "CHANGELOG.md is missing the Keep-a-Changelog footer"; exit 1)'
        files: ^CHANGELOG\.md$
        pass_filenames: false
