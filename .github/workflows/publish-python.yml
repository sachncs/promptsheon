# Publish the promptsheon Python SDK to PyPI on every v* tag.
#
# The publish target is the manifest in sdk/python/pyproject.toml.
# Build artefacts are produced locally (setuptools + wheel) and
# uploaded via twine. PyPI credentials come from the
# PYPI_TOKEN repository secret. Manual approval is enforced via
# the production-pypi environment (the workflow won't run until a
# maintainer approves the run from the GitHub UI).
#
# PLANS-49/c3.8: this workflow replaces the previous "no SDK
# publish automation" state where v* tags pushed binaries but
# never published the Python wheel.

name: publish-python

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (twine check, no upload)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: production-pypi
      url: https://pypi.org/p/production-pypi
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tooling
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine

      - name: Build sdist + wheel
        working-directory: sdk/python
        run: python -m build

      - name: Check metadata (twine check)
        working-directory: sdk/python
        run: twine check dist/*

      - name: Publish to PyPI
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        working-directory: sdk/python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload dist/*

      - name: Dry run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: |
          echo "Dry run: artefacts built and checked. Skipped upload."
          ls -la sdk/python/dist/
