name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: workspace typecheck
        run: pnpm typecheck

  test:
    name: Server Tests
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    needs: [typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: run non-LLM browser gates
        run: >-
          pnpm --dir frontend exec playwright test
          --grep "tier 1:|tier 2:|tier 4:|tier 7:|tier 8:|tier 9:"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build the promptsheon image
        run: docker build -t promptsheon:ci .
      - name: Smoke check (syntax + import graph)
        run: docker run --rm promptsheon:ci node server/dist/index.js --check
      - name: Boot the server and hit /api/health
        run: |
          docker run --rm -d --name promptsheon-ci \
            -p 8080:8080 \
            -e PROMPTSHEON_DB_PATH=/tmp/promptsheon.db \
            -e PROMPTSHEON_CAS_PATH=/tmp/.promptsheon \
            promptsheon:ci
          sleep 5
          curl -fsS http://127.0.0.1:8080/api/health | jq .
          docker stop promptsheon-ci
