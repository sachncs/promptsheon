name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: workspace typecheck
        run: pnpm typecheck
      - name: frontend lint
        run: pnpm --dir frontend lint
      - name: public site check
        run: pnpm --dir site exec astro check
      - name: public site build
        run: pnpm --dir site build
      - name: documentation link check
        run: pnpm check:docs
      - name: supported product claims check
        run: pnpm check:claims
      - name: repository inventory check
        run: pnpm inventory:generate && git diff --exit-code -- docs/baseline/inventory.json
      - name: generate and validate SBOM
        run: |
          bash scripts/build-sbom.sh
          test "$(jq '.packages | length' docs/compliance/sbom.json)" -gt 0
          jq -e '.spdxVersion == "SPDX-2.3" and (.packages | length > 0)' docs/compliance/sbom.json >/dev/null

  test:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    name: Browser Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, test, build]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: install Chromium
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: run credential-free browser gates
        run: >-
          pnpm --dir frontend exec playwright test
          --grep "tier 1:|tier 2:|tier 3:|tier 4:|tier 5:|tier 6:|tier 7:|tier 8:|tier 9:|tier 10:|tier 11:|tier 12:"
      - name: upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, build]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the promptsheon image
        run: docker build -t promptsheon:ci .
      - name: Smoke check (syntax + import graph)
        run: >-
          docker run --rm
          promptsheon:ci --check server/dist/index.js
      - name: Boot the server and hit /api/health
        run: |
          set -Eeuo pipefail
          container_name=promptsheon-ci
          cleanup() {
            docker logs "$container_name" || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --rm -d --name "$container_name" \
            -p 8080:8080 \
            -e PROMPTSHEON_AUTH=true \
            -e PROMPTSHEON_JWT_SECRET=ci-only-secret-with-at-least-32-characters \
            -e PROMPTSHEON_CORS_ORIGIN=http://127.0.0.1:3000 \
            -e PROMPTSHEON_WEBHOOK_SECRET=ci-only-webhook-secret \
            -e PROMPTSHEON_SCIM_TOKEN=ci-only-scim-token \
            -e PROMPTSHEON_SCIM_ORG_ID=ci-only-org \
            -e PROMPTSHEON_DB_PATH=/tmp/promptsheon.db \
            -e PROMPTSHEON_CAS_PATH=/tmp/.promptsheon \
            promptsheon:ci

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/api/ready | jq .; then
              curl --fail --silent --show-error http://127.0.0.1:8080/api/health | jq .
              openapi_route_count=$(curl --fail --silent --show-error http://127.0.0.1:8080/api/openapi.json | jq '.paths | length')
              test "$openapi_route_count" -ge 100
              echo "OpenAPI route paths: $openapi_route_count"
              node scripts/check-api-routes.mjs
              exit 0
            fi
            sleep 1
          done

          echo 'Server did not become ready within 30 seconds' >&2
          exit 1
