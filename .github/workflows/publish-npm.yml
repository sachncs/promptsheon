# Publish the @promptsheon/typescript SDK to npm on every v* tag.
#
# Uses provenance + OIDC for trusted publishing (npm 2024+). npm
# credentials come from the NODE_AUTH_TOKEN repository secret;
# manual approval via the production-npm environment gates the
# publish run.
#
# PLANS-49/c3.9: replaces the previous state where v* tags never
# published the TypeScript SDK.

name: publish-npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (npm pack, no publish)'
        required: false
        default: 'false'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: production-npm
      url: https://www.npmjs.com/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      - name: Build (tsc)
        working-directory: sdk/typescript
        run: npm run build

      - name: Pack dry-run artefacts
        working-directory: sdk/typescript
        run: npm pack --dry-run

      - name: Publish to npm (with provenance)
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        working-directory: sdk/typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == 'true'
        run: |
          echo "Dry run: artefacts packed. Skipped publish."
          ls -la sdk/typescript/dist/ 2>/dev/null || true
