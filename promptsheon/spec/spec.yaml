  /ready:
    get:
      summary: "handleReady returns 200 only when every downstream the daemon depends on for correct operation is reachable:    - The SQLite database responds to Ping (operator's data).   - The OTel tracer is reachable (the daemon otherwise can't     ship traces to the operator's collector; failures here     will not stall the request path but they do mean the     observability story is broken).   - The audit worker queue has room (degraded audit means     we may be losing entries; the queue depth is exposed     so K8s readiness can shed traffic before drops begin).  A failed probe returns 503 with a body naming the failing component so operators can triage from the kubelet log without digging through the daemon log. Ready handles the request."
      security: []
      responses:
        "200":
          description: OK
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
